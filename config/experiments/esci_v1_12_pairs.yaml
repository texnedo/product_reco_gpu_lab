schema_version: 1

run:
  label: v1-12pairs
  aml_experiment_name: qwen-esci-reranker

assets:
  data: azureml:esci-ranking:1
  model: azureml:qwen3-reranker-0-6b:1

prompt:
  file: config/prompts/esci_v1.txt

preprocessing:
  text_cleaning: none

data:
  train_queries: 5000
  eval_queries: 1000
  small_version: true

model:
  max_length: 512

lora:
  rank: 16
  alpha: 32
  dropout: 0.05

training:
  epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.01
  pair_weighting: none

sampling:
  strategy: query_round_robin
  pairs_per_query: 12
  balance_fraction: 0.0
  balanced_pairs_per_type_per_query: 12

evaluation:
  batch_size: 8
  ndcg_k: 10
  selection_queries: 0
  selection_every_steps: 0
  selection_min_delta: 0.0

checkpoint:
  every_steps: 25
  keep: 3
  resume: true

runtime:
  num_workers: 2
  seed: 42
